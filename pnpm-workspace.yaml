shellEmulator: true

trustPolicy: no-downgrade

packages:
  - apps/*
  - packages/*
overrides:
  '@unhead/vue': npm:@unhead/vue@3.4.0
  markdown-it: npm:markdown-exit@1.3.0
patchedDependencies:
  markdown-it-table-of-contents: patches/markdown-it-table-of-contents.patch
  vite-ssg: patches/vite-ssg.patch
onlyBuiltDependencies:
  - esbuild
  - sharp
  - vue-demi
